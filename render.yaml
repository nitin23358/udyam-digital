services:
  - type: web
    name: udyam-digital
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm run build:host
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
